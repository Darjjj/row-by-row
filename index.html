<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" id="themeColor" content="#fffcf6">
  <script>
    // Light or dark before the first paint: her choice under More ("rowbyrow.theme": light / dark), else the phone's setting.
    function applyTheme() {
      var t = null; try { t = localStorage.getItem("rowbyrow.theme"); } catch (e) {}
      var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      var m = document.getElementById("themeColor"); if (m) m.content = dark ? "#1c1926" : "#fffcf6";
    }
    applyTheme();
  </script>
  <meta name="description" content="Follow pixel crochet patterns one row at a time.">
